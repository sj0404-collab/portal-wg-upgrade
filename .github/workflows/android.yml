name: AetherWG Release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :ui:assembleRelease --no-daemon || ./gradlew assembleRelease --no-daemon
          find . -name '*.apk' -print
      - uses: actions/upload-artifact@v4
        with:
          name: aetherwg-apk
          path: |
            ui/build/outputs/apk/release/*.apk
            **/outputs/apk/**/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: AetherWG 1.4.0
          generate_release_notes: true
          files: ui/build/outputs/apk/release/*.apk
